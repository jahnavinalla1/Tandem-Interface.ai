name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.x"
          enable-cache: true

      - name: Install project dependencies (frozen, reproducible, dev tools included)
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy tandem simulators

      - name: Install Playwright Chromium with system dependencies
        run: uv run playwright install chromium --with-deps

      - name: Run unit/integration/e2e/regression suite
        run: uv run pytest tests -v

      - name: Run preserved independent adversarial audit suite
        run: uv run pytest audit_tests -v

      - name: Build container image
        run: docker build --tag tandem-ci .

      - name: Build distributable wheel and sdist
        run: uv build

      - name: Wheel install smoke test
        run: |
          uv venv /tmp/tandem-wheel-smoke
          uv pip install --python /tmp/tandem-wheel-smoke/bin/python dist/*.whl
          /tmp/tandem-wheel-smoke/bin/python -c "import tandem.cli; assert callable(tandem.cli.main)"
          test -x /tmp/tandem-wheel-smoke/bin/tandem
