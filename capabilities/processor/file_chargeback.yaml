id: "processor.file_chargeback"
version: "1.0.0"
schema_version: 1
created_at: "2026-09-12T00:00:00+00:00"
name: "File Card Chargeback"
description: "Submit a card-network chargeback through the deterministic processor adapter"
system: "processor"
supported_surfaces: ["processor"]
effect:
  class: "COMMIT"
  idempotency_key: "regE:{{input.case_id}}:chargeback"
  identity:
    institution_id: "{{input.institution_id}}"
    procedure_id: "reg_e_dispute"
    case_id: "{{input.case_id}}"
    capability_id: "processor.file_chargeback"
    member_id: "{{input.member_id}}"
    account_id: "{{input.account_id}}"
    amount: "{{input.amount}}"
    currency: "{{input.currency}}"
    business_reference: "{{input.case_id}}"
  precheck:
    capability: "processor.find_chargeback_by_case"
    params: {case_id: "{{input.case_id}}"}
    if_found: "ALREADY_APPLIED"
  postcheck:
    capability: "processor.find_chargeback_by_case"
    params: {case_id: "{{input.case_id}}"}
    expected_status: "FILED"
  reconciliation:
    strategy: "POSTCHECK_OR_UNCERTAIN"
    max_inquiry_attempts: 2
  bounds:
    max_amount: 500.00
    currency: "USD"
input_schema:
  type: "object"
  properties:
    institution_id: {type: "string"}
    member_id: {type: "string"}
    account_id: {type: "string"}
    case_id: {type: "string"}
    amount: {type: "number"}
    currency: {type: "string", const: "USD"}
    card_last4: {type: "string"}
  required: [institution_id, member_id, account_id, case_id, amount, currency, card_last4]
output_schema:
  type: "object"
  properties:
    processor_reference: {type: "string"}
  required: [processor_reference]
scoped_guard:
  guard_id: "processor_request_identity"
  container_selector: "request-payload"
steps:
  - step_id: "submit_chargeback_request"
    action: "HTTP_POST"
    semantic_target: "processor-chargeback-route"
    locator_candidates: []
    guard_ref: "processor_request_identity"
source_discovery_run_id: null
artifact_hash: "25293532042838fc397070365d9aee68abd6515a6d5bd765112094c919f8cbfa"
